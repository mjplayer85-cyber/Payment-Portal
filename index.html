<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Ledger v14.0 - Complete Restoration Fix</title>
  <!-- Firebase Libraries -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <style>
    :root {
      --bg-color: #121311;
      --card-bg: #1c1d1a;
      --border-color: #2e302b;
      --text-color: #d1d5db;
      --accent-color: #22c55e;
      --accent-bg: #143820;
      --avail-color: #3b82f6;
      --avail-bg: #1e3a8a;
      --input-bg: #121311;
      --button-bg: #e5e7eb;
      --button-text: #111827;
      --danger-color: #ef4444;
      --calc-bg: #1b2838;
      --calc-border: #2a475e;
    }

    .light-theme {
      --bg-color: #f9fafb;
      --card-bg: #ffffff;
      --border-color: #e5e7eb;
      --text-color: #1f2937;
      --accent-color: #16a34a;
      --accent-bg: #dcfce7;
      --avail-color: #2563eb;
      --avail-bg: #dbeafe;
      --input-bg: #ffffff;
      --button-bg: #1f2937;
      --button-text: #ffffff;
      --calc-bg: #f0f9ff;
      --calc-border: #bae6fd;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); padding: 30px 20px; max-width: 980px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; }
    .title { font-size: 24px; font-weight: bold; }
    .header-right { text-align: right; }
    .subtext { font-size: 11px; opacity: 0.7; margin-bottom: 8px; }
    .btn-toggle { background: none; border: 1px solid var(--border-color); color: var(--text-color); padding: 6px 12px; cursor: pointer; font-size: 11px; margin-left: 4px; border-radius: 4px; }

    /* Calculators Grid */
    .calc-container { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
    .calc-box { background: var(--calc-bg); border: 1px solid var(--calc-border); padding: 16px; border-radius: 6px; }
    .calc-title { font-size: 13px; font-weight: bold; color: #38bdf8; margin-bottom: 10px; display: flex; justify-content: space-between; }
    .calc-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
    .calc-row label { font-size: 11px; opacity: 0.8; display: block; margin-bottom: 4px; }
    .calc-row input, .calc-row select { padding: 8px; font-size: 12px; background: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-color); border-radius: 4px; width: 100%; }

    .alloc-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 6px; text-align: center; }
    .alloc-item { background: var(--input-bg); border: 1px solid var(--border-color); padding: 8px; border-radius: 4px; }
    .alloc-item span { display: block; font-size: 10px; opacity: 0.7; }
    .alloc-item strong { font-size: 11px; color: #ef4444; display: block; margin-top: 2px; }
    .alloc-item .net-val { font-size: 11px; color: var(--accent-color); font-weight: bold; margin-top: 4px; border-top: 1px dashed var(--border-color); padding-top: 4px; }

    /* Company Navigation Section */
    .company-section { background: var(--card-bg); border: 1px solid var(--border-color); padding: 16px; border-radius: 6px; margin-bottom: 20px; }
    .company-title { font-size: 13px; font-weight: bold; color: #f59e0b; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .company-pills { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .company-pill { padding: 8px 14px; background: var(--input-bg); border: 1px solid var(--border-color); font-size: 12px; font-weight: bold; cursor: pointer; border-radius: 4px; color: var(--text-color); display: flex; align-items: center; gap: 6px; }
    .company-pill.active { background: #451a03; border-color: #f59e0b; color: #fbbf24; }
    .company-pill .btn-del-comp { color: var(--danger-color); font-size: 10px; margin-left: 6px; padding: 0 4px; background: none; border: none; cursor: pointer; }

    /* Accounts Section Cards */
    .start-date-box { background: var(--card-bg); border: 1px solid var(--border-color); padding: 16px; border-radius: 4px; margin-bottom: 24px; }
    .start-date-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; margin-top: 12px; }
    
    .account-card { background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 4px; padding: 12px; cursor: pointer; transition: 0.2s; position: relative; }
    .account-card:hover { border-color: var(--accent-color); }
    .account-card.active { border-color: var(--accent-color); background: var(--accent-bg); }
    .account-card h4 { font-size: 14px; color: var(--accent-color); margin-bottom: 4px; padding-right: 110px; word-break: break-word; }
    .acc-sub-info { font-size: 11px; opacity: 0.8; display: flex; justify-content: space-between; margin-top: 4px; }
    
    .acc-actions { position: absolute; top: 10px; right: 10px; display: flex; gap: 2px; }
    .btn-acc-action { background: transparent; border: 1px solid var(--border-color); color: var(--text-color); font-size: 10px; padding: 2px 5px; border-radius: 3px; cursor: pointer; }
    .btn-acc-action.danger { color: var(--danger-color); border-color: var(--danger-color); }

    /* Form Container */
    .form-container { background: var(--card-bg); border: 1px solid var(--border-color); padding: 20px; border-radius: 4px; margin-bottom: 24px; }
    .form-row { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
    .form-group { flex: 1; min-width: 140px; }
    label { display: block; font-size: 11px; margin-bottom: 4px; opacity: 0.8; }
    input, select { width: 100%; padding: 8px; background: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-color); border-radius: 4px; outline: none; font-size: 12px; }

    .toggle-row { display: flex; gap: 20px; margin-bottom: 12px; font-size: 11px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
    .toggle-label { display: flex; align-items: center; gap: 6px; cursor: pointer; }

    .status-group { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .status-btn { flex: 1; min-width: 110px; padding: 8px; background: transparent; border: 1px solid var(--border-color); color: var(--text-color); cursor: pointer; border-radius: 4px; text-align: center; font-size: 11px; font-weight: bold; }
    .status-btn.active { border-color: var(--accent-color); color: var(--accent-color); background: var(--accent-bg); }
    .status-btn.special { border-color: #f59e0b; color: #f59e0b; }
    .status-btn.special.active { background: #451a03; color: #fbbf24; border-color: #fbbf24; }

    .btn-submit { float: right; background: var(--button-bg); color: var(--button-text); border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; border-radius: 4px; font-size: 12px; }

    /* Bottom Breakdown Area */
    .bottom-breakdown { background: var(--card-bg); border: 1px solid var(--border-color); padding: 16px; border-radius: 4px; margin-top: 24px; }
    .breakdown-tabs { display: flex; gap: 8px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 12px; overflow-x: auto; }
    .b-tab { font-size: 11px; padding: 6px 12px; background: var(--input-bg); border: 1px solid var(--border-color); cursor: pointer; border-radius: 4px; white-space: nowrap; }
    .b-tab.active { background: var(--avail-bg); color: var(--avail-color); border-color: var(--avail-color); font-weight: bold; }

    .entry-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border-color); font-size: 12px; }
    .entry-left { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .entry-badge { padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; background: var(--border-color); }

    .total-sum-box { background: var(--input-bg); border: 1px solid var(--border-color); padding: 12px; border-radius: 4px; margin-top: 16px; font-size: 13px; font-weight: bold; text-align: right; }
    .net-hisab-banner { padding: 12px; border-radius: 4px; margin-top: 12px; font-size: 13px; font-weight: bold; text-align: center; border: 1px solid var(--border-color); }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <h1 class="title">Payment Ledger v14.0</h1>
    <div class="header-right">
      <div class="subtext">Cloud Live Sync Active ☁️</div>
      <button class="btn-toggle" onclick="exportData()">💾 Backup</button>
      <button class="btn-toggle" onclick="toggleTheme()">Theme</button>
    </div>
  </div>

  <!-- Calculators Section -->
  <div class="calc-container">
    <div class="calc-box">
      <div class="calc-title"><span>💵 Fixed USD Calculator (Rate: 275)</span></div>
      <div class="calc-row">
        <div style="flex:1;">
          <label>PKR Amount</label>
          <input type="number" step="any" id="usd-pkr-input" placeholder="e.g. 50000" oninput="calcFixedUSD()">
        </div>
        <div style="flex:1;">
          <label>Converted USD ($)</label>
          <input type="text" id="usd-res-output" readonly style="color: var(--accent-color); font-weight: bold;">
        </div>
      </div>
    </div>

    <div class="calc-box">
      <div class="calc-title"><span>📊 Multi-Cut & Net Calculator</span></div>
      <div class="calc-row" style="margin-bottom: 6px;">
        <div style="flex:1.5;">
          <label>Total Amount</label>
          <input type="number" step="any" id="alloc-input-amount" placeholder="e.g. 100000" oninput="calcAllocations()">
        </div>
        <div style="flex:1;">
          <label>Currency</label>
          <select id="alloc-currency-select" onchange="calcAllocations()">
            <option value="PKR">PKR</option>
            <option value="CNY">CNY</option>
            <option value="USD">USD ($)</option>
          </select>
        </div>
      </div>
      <div class="alloc-grid">
        <div class="alloc-item">
          <span>10% Cut</span>
          <strong id="alloc-10-cut">- PKR 0.00</strong>
          <div class="net-val">Remaining: <br><span id="alloc-10-net">PKR 0.00</span></div>
        </div>
        <div class="alloc-item">
          <span>20% Cut</span>
          <strong id="alloc-20-cut">- PKR 0.00</strong>
          <div class="net-val">Remaining: <br><span id="alloc-20-net">PKR 0.00</span></div>
        </div>
        <div class="alloc-item">
          <span>30% Cut</span>
          <strong id="alloc-30-cut" style="color: #ef4444;">- PKR 0.00</strong>
          <div class="net-val" style="color: #38bdf8;">Net Receive: <br><span id="alloc-30-net">PKR 0.00</span></div>
        </div>
      </div>
    </div>
  </div>

  <!-- SECTION 1: Company / App Selector -->
  <div class="company-section">
    <div class="company-title">
      <span>🏢 1. Select Company / App</span>
      <button onclick="addNewCompany()" style="padding: 4px 8px; background: #451a03; color: #fbbf24; border: 1px solid #f59e0b; border-radius: 4px; font-size: 11px; cursor: pointer; font-weight: bold;">➕ Add New Company</button>
    </div>
    <div class="company-pills" id="companies-container"></div>
  </div>

  <!-- SECTION 2: Accounts inside Selected Company -->
  <div class="start-date-box">
    <div style="font-size: 13px; font-weight: bold; color: var(--accent-color); margin-bottom: 8px;">
      👤 2. Accounts Under <span id="current-company-label" style="color: #38bdf8;">Loading...</span>
    </div>
    <div class="start-date-grid" id="accounts-container"></div>

    <div style="margin-top: 14px; border-top: 1px solid var(--border-color); padding-top: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
      <input type="text" id="new-acc-name" placeholder="Account Name (e.g. Main Account)..." style="max-width: 220px;">
      <input type="text" id="new-
